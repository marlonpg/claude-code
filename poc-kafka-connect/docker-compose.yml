version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: pg-source-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./setup-postgres.sql:/docker-entrypoint-initdb.d/setup.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  connect:
    image: confluentinc/cp-kafka-connect:latest
    container_name: kafka-connect
    depends_on:
      - kafka
      - postgres
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:9092
      CONNECT_GROUP_ID: postgres-connect-group
      CONNECT_CONFIG_STORAGE_TOPIC: __connect_offsets
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_TOPIC: __connect_offsets
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_TOPIC: __connect-status
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_PLUGIN_PATH:
        /usr/share/java/connectors/,
        /app/debezium-connector-postgres.jar
      CONNECT_REST_ADVERTISED_LISTENERS: http://localhost:8083
      CONNECT_REST_HOST_NAME: kafka-connect
      CONNECT_LISTENERS: http://0.0.0.0:8083
      CONNECT_LOG4J_LOGGERS: org.apache.kafka.connect.errors=WARN
    volumes:
      - ./config:/app/config:ro
      - ./connectors:/app/connectors
    command:
      - bash
      - -c
      - |
        echo "Waiting for Kafka to be ready..."
        until nc -z kafka 9092; do sleep 5; done
        echo "Kafka is ready"
        /app/bin/connect-standalone.sh /app/config/connector.properties /app/connectors/postgres-connector.json

  connectors:
    image: quay.io/debezium/debezium-connector-postgres:latest
    container_name: postgres-connector
    depends_on:
      - postgres
      - kafka
      - connect
    environment:
      CONNECTOR_NAME: postgres-source
      BOOTSTRAP_SERVERS: kafka:9092
      DATABASE.hostname: postgres
      DATABASE.port: "5432"
      DATABASE.dbname: mydb
      DATABASE.user: postgres
      DATABASE.password: postgres
      DATABASE.include.list: "public.*"
      DATABASE.server.name: pg-source
      DATABASE.server.id: "18455"
      DATABASE.replication.slot.name: "kafka-connect-replication"
      DATABASE.publication.name: "pg_publication"
      DATABASE.history.storage: file
      DATABASE.history.filename: /var/lib/kafkaconnect/dbhistory.pb
      FORMAT.key: String
      FORMAT.value: String
      FORMAT.schemas.enable: "false"
      PUBLISH.with.transaction.log: "false"
    volumes:
      - connector_data:/var/lib/kafkaconnect
    ports:
      - "8084:8083"

volumes:
  postgres_data:
  connector_data:
