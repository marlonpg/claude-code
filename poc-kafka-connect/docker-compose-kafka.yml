services:
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  connector:
    image: quay.io/debezium/debezium-connector-postgres:latest
    container_name: debezium-connector
    depends_on:
      - kafka
      - postgres
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:9092
      CONNECT_GROUP_ID: postgres-connect-group
      CONNECT_CONFIG_STORAGE_TOPIC: __connect_offsets
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: "60000"
      CONNECT_OFFSET_STORAGE_SCHEMA_REGISTRY: __connect_schemas
      CONNECT_STATUS_STORAGE_TOPIC: __connect-status
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      DATABASE_HOSTNAME: postgres
      DATABASE_PORT: "5432"
      DATABASE_DBNAME: mydb
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_INCLUDE_LIST: "public.*"
      DATABASE_SERVER_NAME: pg-source
      DATABASE_SERVER_ID: "18455"
      DATABASE_REPLICATION_SLOT_NAME: "kafka-connect-replication"
      DATABASE_PUBLICATION_NAME: "pg_publication"
      DATABASE_HISTORY_STORAGE: file
      DATABASE_HISTORY_FILENAME: /var/lib/kafkaconnect/dbhistory.pb
      FORMAT_KEY: String
      FORMAT_VALUE: String
      FORMAT_SCHEMAS_ENABLE: "false"
      PUBLISH_WITH_TRANSACTION_LOG: "false"
    volumes:
      - connector_data:/var/lib/kafkaconnect

  connect:
    image: confluentinc/cp-kafka-connect:7.6.0
    container_name: kafka-connect
    depends_on:
      - kafka
      - debezium-connector
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:9092
      CONNECT_GROUP_ID: postgres-connect-group
      CONNECT_CONFIG_STORAGE_TOPIC: __connect_offsets
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_TOPIC: __connect_offsets
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_TOPIC: __connect-status
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: "60000"
      CONNECT_REST_ADVERTISED_LISTENERS: http://localhost:8083
      CONNECT_REST_LISTENERS: "http://0.0.0.0:8083"
      CONNECT_LOGGERS: org.apache.kafka.connect.errors=warn,io.debezium=warn

volumes:
  connector_data:
